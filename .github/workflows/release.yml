# Builds the Windows installer and publishes it as a GitHub Release.
#
# To release: bump "version" in package.json, commit, then
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the installer

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Publishing is done by the next step, so electron-builder only builds.
      - run: npm run dist -- --publish never

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
